#sidebar > :not(nav){flex-shrink:0}#nav .nav-item{padding:9px 14px}body{margin:0;background:#FAF8F7;color:#403E3C;font-family:'DM Sans',sans-serif}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}input:not([type="file"]):not([type="checkbox"]),body select,body textarea{width:100%;border:1px solid #DEDAD7;border-radius:7px;padding:11px 12px;background:white;color:#21201F;font:inherit}textarea{resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid #0040E6;outline-offset:2px}button:focus-visible,a:focus-visible{outline:2px solid #709AF1;outline-offset:4px}.icon{width:20px;height:20px;display:inline-block;vertical-align:middle;flex-shrink:0}.nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:7px;color:#403E3C;font-size:13px;width:100%;text-align:left;transition:.15s}.nav-item:hover{background:#DFEAF8;color:#002F93}.nav-item.active{background:#DFEAF8;color:#002F93;box-shadow:inset 3px 0 0 #0040E6;font-weight:500}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 15px;border-radius:6px;font-size:13px;font-weight:500;white-space:nowrap}.primary{background:#0040E6;color:white}.primary:hover{background:#002F93}.secondary{background:white;border:1px solid #DEDAD7;color:#403E3C}.secondary:hover{background:#FAF8F7}.card{background:white;border:1px solid #DEDAD7;border-radius:8px}.eyebrow{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}.muted{color:#736D68}.badge{font-size:10px;padding:4px 8px;border-radius:4px;background:#F2F4F7;color:#403E3C;display:inline-block}.badge-blue{background:#DFEAF8;color:#002F93}.prose-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;font-size:14px}dialog{border:1px solid #DEDAD7;border-radius:12px;width:min(760px,calc(100vw - 24px));padding:0;max-height:90vh;color:#403E3C}dialog::backdrop{background:rgba(20,20,25,.5);backdrop-filter:blur(3px)}.field-label{display:block;font-size:12px;font-weight:500;margin-bottom:7px}.empty-icon{width:50px;height:50px;display:flex;align-items:center;justify-content:center;background:#F2F4F7;border-radius:12px;color:#0040E6;margin:0 auto 16px}.resource-card{transition:transform .15s,box-shadow .15s}.resource-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px #21201f09}.source-link{text-align:left;font-size:12px;color:#0040E6;text-decoration:underline;text-underline-offset:3px}.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}@media(max-width:1023px){#sidebar{transform:translateX(-100%);transition:transform .2s}#sidebar.open{transform:translateX(0)}#shade.open{display:block}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* AI practice card: five visible proficiency labels, matching the portfolio reference. */
.builder-practice{padding:20px 22px;background:#F2F4F7;border:1px solid #c4d9f3;border-radius:10px;color:#002F93;min-width:0}
.builder-practice-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:10px;letter-spacing:1px;text-transform:uppercase}
.builder-practice-head p{margin:0}.builder-practice-learning{white-space:nowrap}
.builder-practice-dot{width:6px;height:6px;background:#0040E6;border-radius:50%;display:inline-block;margin-right:6px}
.builder-practice-number{font-size:54px;line-height:1;letter-spacing:-4px;font-weight:500;margin:10px 0 0}

.builder-practice-title{font-size:21px;font-weight:500;line-height:1.2;margin:6px 0 8px}
.builder-practice-description{font-size:12px;line-height:1.45;color:#403E3C;margin:0}
.builder-practice-levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:14px 0 0;padding:0;list-style:none}
.builder-practice-levels li{font-size:8px;line-height:1.45;text-align:center;padding-top:6px;border-top:4px solid #709AF1;min-width:0}
.builder-practice-levels span{display:block}.builder-practice-levels .current{border-color:#0040E6;font-weight:700}
.builder-practice-levels .future{border-color:#c4d9f3;color:#736D68}
.builder-practice-note{font-size:9px;line-height:1.4;color:#736D68;margin:9px 0 0}
@media(max-width:420px){.builder-practice{padding:20px 16px}.builder-practice-head{font-size:9px;gap:6px}.builder-practice-number{font-size:70px}.builder-practice-levels{gap:4px}.builder-practice-levels li{font-size:9px}}

<script>
const icons={grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',book:'<path d="M12 5v16M3 3c4-1 7 0 9 2 2-2 5-3 9-2v16c-4-1-7 0-9 2-2-2-5-3-9-2Z"/>',file:'<path d="M14 2H5v20h14V7Z M14 2v6h5M8 12h8M8 16h6"/>',flask:'<path d="M9 3h6M10 3v7L4 20a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1l-6-10V3M7 16h10"/>',spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',edit:'<path d="m15 4 5 5M4 20l5-1L21 7l-5-5L4 14Z"/>',check:'<path d="m5 12 4 4L19 6"/>',folder:'<path d="M3 7V4h6l3 3h9v14H3Z"/>',send:'<path d="m3 3 19 9-19 9 4-9Zm4 9h15"/>'};
const icon=(name)=>`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.file}</svg>`;
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=v=>new Date(v).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const sections=[['overview','grid','Overview'],['builder','flask','JD AI Builder'],['hub','book','Knowledge hub'],['projects','flask','AI projects & learning'],['assistant','spark','AI audit assistant'],['soc','file','SOC report review'],['sec','book','SEC disclosure review'],['accounting-agents','spark','Useful Accounting AI Agent']];
const labels={article:'Article','case-study':'Case study',template:'Template',project:'AI project'};
const topics=['Risk assessment','Scoping','Control design','Testing','Deficiency evaluation','Audit communication','SOC reports','Evidence checks','Data analysis','Audit follow-ups'];
let state={resources:[],activity:[],profile:{},conversations:[]},page='overview',filters={query:'',category:'',status:'',kind:''},loaded=false,toastTimer,busy=false;
const $=s=>document.querySelector(s);
function toast(message){$('#toast').textContent=message;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),5500)}
async function api(path,method='GET',data,timeout=30000){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);try{const r=await fetch(path,{method,signal:controller.signal,headers:{'Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});if(!r.ok){const e=await r.json().catch(()=>({}));throw Error(e.error||'Request failed. Please retry.')}return r.status===204?null:r.json()}catch(e){if(e.name==='AbortError')throw Error('The server took too long to respond. Your request may still be processing; refresh before retrying.');throw e}finally{clearTimeout(timer)}}
async function refresh(){state=await api('/api/state');loaded=true;$('#connection').innerHTML='<span class="w-1.5 h-1.5 rounded-full bg-brand"></span>Supabase connected';render()}
function heading(kicker,title,desc,action=''){return `<div class="flex flex-wrap items-end justify-between gap-5 mb-8"><div><p class="eyebrow text-brand mb-3">${kicker}</p><h1 class="text-2xl sm:text-[30px] leading-tight font-medium text-ink tracking-tight">${title}</h1><p class="muted text-sm mt-3 max-w-2xl leading-relaxed">${desc}</p></div>${action}</div>`}
function button(text,action='new',cls='primary',attrs=''){return `<button class="btn ${cls}" data-action="${action}" ${attrs}>${icon(action==='new'?'plus':action==='edit-profile'?'edit':'arrow')}${text}</button>`}
function empty(title,description,action='new',text='Create your first resource',symbol='book'){return `<div class="card px-6 py-12 text-center"><div class="empty-icon">${icon(symbol)}</div><h3 class="font-medium text-ink">${title}</h3><p class="text-xs muted leading-relaxed max-w-md mx-auto mt-2 mb-5">${description}</p>${action?button(text,action,'secondary'):''}</div>`}
function resourceCard(r){return `<article class="card resource-card p-6 flex flex-col min-h-[235px]"><div class="flex justify-between items-center gap-2 mb-5"><span class="eyebrow text-brand">${esc(labels[r.kind])}</span><span class="badge ${r.status!=='Draft'?'badge-blue':''}">${esc(r.status)}</span></div><button data-action="detail" data-id="${r.id}" class="text-left text-lg font-medium leading-snug text-ink hover:text-brand">${esc(r.title)}</button><p class="text-xs muted leading-relaxed mt-3 line-clamp-2">${esc(r.summary||r.content.slice(0,180))}</p><div class="flex flex-wrap gap-1.5 mt-4">${r.category?`<span class="badge">${esc(r.category)}</span>`:''}${r.kind==='project'?`<span class="badge">${esc(r.phase)}</span>`:''}</div><div class="flex items-center justify-between border-t border-[#ECE9E7] mt-5 pt-4 text-[10px] muted"><span>Updated ${date(r.updated_at)}</span><button data-action="detail" data-id="${r.id}" aria-label="Open ${esc(r.title)}" class="text-brand">${icon('arrow')}</button></div></article>`}
function overview(){const counts=['article','case-study','template','project'].map(kind=>state.resources.filter(r=>r.kind===kind).length);return heading('The audit practice, reimagined','Welcome to the lab.','Your working space for better audit thinking, practical resources, and learning by doing.')+`<section class="bg-[#DFEAF8] border border-[#c4d9f3] rounded-xl relative overflow-hidden text-[#002F93] p-7 sm:p-10 mb-7"><div class="absolute right-[-70px] top-[-90px] w-[420px] h-[420px] rounded-full border border-[#0040E6]/10 pointer-events-none"><div class="absolute inset-12 rounded-full border border-[#0040E6]/10"></div><div class="absolute inset-24 rounded-full border border-[#0040E6]/10"></div><div class="absolute inset-36 rounded-full border border-[#0040E6]/20"></div></div><div class="relative max-w-xl"><p class="eyebrow text-brand mb-4">JD’s SOX/IA AI Lab</p><h2 class="text-[27px] sm:text-[34px] leading-tight tracking-tight font-medium">Experience meets curiosity.<br>Better audits start here.</h2><p class="text-sm text-[#403E3C] mt-4 leading-relaxed max-w-md">A space for SOX, Internal Audit, and AI in practice. Capture what you know. Explore what’s next.</p><div class="flex flex-wrap gap-3 mt-7"><button data-action="navigate" data-page="hub" class="btn primary">Explore knowledge hub ${icon('arrow')}</button><button data-action="navigate" data-page="assistant" class="btn bg-white border border-[#c4d9f3] text-[#002F93]">${icon('spark')}Open assistant</button></div></div><div class="hidden xl:block absolute right-16 bottom-12 text-[11px] tracking-[.2em] text-[#002F93]/70">KNOWLEDGE → PRACTICE → PROGRESS</div></section><section class="grid grid-cols-2 xl:grid-cols-4 gap-4 mb-9">${['Knowledge articles','Case studies','Reusable templates','AI projects'].map((x,i)=>`<div class="card p-5"><div class="flex items-center justify-between"><span class="text-xs muted">${x}</span><span class="text-brand">${icon(['book','folder','file','flask'][i])}</span></div><div class="text-3xl font-medium text-ink mt-4">${counts[i]}</div><p class="text-[10px] muted mt-2">${i===3?'Ideas through lessons learned':'In your workspace'}</p></div>`).join('')}</section><div class="grid xl:grid-cols-[1fr_310px] gap-7"><section><div class="flex justify-between items-center mb-5"><h2 class="text-lg text-ink font-medium">Your knowledge, in motion</h2><button data-action="navigate" data-page="hub" class="text-xs text-brand">View library →</button></div>${state.resources.length?`<div class="grid md:grid-cols-2 gap-4">${[...state.resources].sort((a,b)=>b.updated_at.localeCompare(a.updated_at)).slice(0,4).map(resourceCard).join('')}</div>`:empty('Start with what you know','Add your first article or AI project. Your library and recent resources will grow from here.')}</section><section><h2 class="text-lg text-ink font-medium mb-5">Inside the lab</h2><div class="card divide-y divide-[#ECE9E7]">${[['builder','flask','Meet the builder behind the practice','AI projects, learning & approach'],['hub','book','Explore practical knowledge','SOX and internal audit guidance'],['projects','flask','Learn through experimentation','AI projects, results & reflections']].map(([p,i,t,d])=>`<button data-action="navigate" data-page="${p}" class="p-5 flex items-start gap-3 text-left w-full hover:bg-paper"><span class="text-brand mt-1">${icon(i)}</span><span><span class="block text-sm font-medium text-ink">${t}</span><span class="block text-[11px] muted mt-2 leading-relaxed">${d}</span></span></button>`).join('')}</div><div class="mt-5 px-1"><p class="eyebrow muted mb-3">A note on AI</p><p class="text-xs leading-relaxed muted">A thinking partner for your audit work. Every AI output stays a draft until you review it.</p></div></section></div>`}
function library(){const config={hub:['Knowledge & practice','SOX & Internal Audit Knowledge Hub','Practical knowledge, organized around the work you do.'],cases:['From experience to action','Case studies & templates','Anonymized examples, checklists, and repeatable ways to move your work forward.'],projects:['Experiment. Reflect. Improve.','AI projects & learning','Track your experiments, document the results, and carry the lessons forward.'],search:['Your knowledge, connected','Search resources','Find articles, case studies, templates, and projects across your workspace.']}[page];let base=state.resources.filter(r=>page==='hub'?r.kind==='article':page==='cases'?['case-study','template'].includes(r.kind):page==='projects'?r.kind==='project':true);const categories=[...new Set([...topics,...base.map(r=>r.category).filter(Boolean)])];let result=base.filter(r=>(!filters.query||[r.title,r.summary,r.content,r.owner,r.results,r.lessons,r.category,...r.tags].join(' ').toLowerCase().includes(filters.query.toLowerCase()))&&(!filters.category||r.category===filters.category)&&(!filters.status||r.status===filters.status)&&(!filters.kind||r.kind===filters.kind));return heading(...config,button(page==='projects'?'New project':'New resource'))+`<section class="card p-4 mb-6 flex flex-wrap gap-3"><div class="relative flex-1 min-w-[200px]"><span class="absolute left-3 top-3 muted">${icon('search')}</span><input id="librarySearch" aria-label="Search this collection" value="${esc(filters.query)}" placeholder="Search this collection…" class="!text-xs !pl-10"></div><select id="categoryFilter" aria-label="Filter by topic" class="!text-xs !w-auto max-w-full"><option value="">All topics</option>${categories.map(c=>`<option ${filters.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select id="statusFilter" aria-label="Filter by status" class="!text-xs !w-auto"><option value="">All statuses</option>${['Draft','Reviewed','Published'].map(s=>`<option ${filters.status===s?'selected':''}>${s}</option>`).join('')}</select>${['cases','search'].includes(page)?`<select id="kindFilter" aria-label="Filter by type" class="!text-xs !w-auto"><option value="">All types</option>${Object.entries(labels).filter(([k])=>page==='search'||['case-study','template'].includes(k)).map(([k,v])=>`<option value="${k}" ${filters.kind===k?'selected':''}>${v}</option>`).join('')}</select>`:''}</section><div class="flex justify-between text-xs muted mb-5"><span>${result.length} resource${result.length!==1?'s':''}</span><span>Most recently updated first</span></div>${result.length?`<div class="grid md:grid-cols-2 xl:grid-cols-3 gap-5">${result.sort((a,b)=>b.updated_at.localeCompare(a.updated_at)).map(resourceCard).join('')}</div>`:base.length?empty('No matching resources','Try another search or clear the filters.','clear-filters','Clear filters','search'):empty(page==='projects'?'Your next experiment starts here.':'A little knowledge goes a long way.',page==='projects'?'Add an AI project to track its owner, phase, results, and lessons learned.':'This collection is empty. Add your own content to begin building a useful audit library.','new',page==='projects'?'Create a project':'Create a resource',page==='projects'?'flask':'book')}`}
function turnHtml(t){return `<article class="card p-6 mb-4"><div class="flex justify-between flex-wrap gap-2"><span class="eyebrow text-brand">${esc(t.task)}</span><span class="badge">${esc(t.mode)} · ${date(t.at)}</span></div><h3 class="text-base text-ink font-medium mt-4">${esc(t.question)}</h3>${t.evidence?`<details class="mt-3"><summary class="text-xs muted cursor-pointer">Provided evidence / notes</summary><p class="prose-text mt-3">${esc(t.evidence)}</p></details>`:''}<div class="prose-text mt-5">${esc(t.answer)}</div>${t.sources.length?`<div class="border-t border-line mt-5 pt-4"><p class="eyebrow muted mb-3">Source snapshots · at time of request</p><div class="flex flex-col items-start gap-2">${t.sources.map((s,i)=>`<button data-action="detail" data-id="${s.id}" class="source-link">[${i+1}] ${esc(s.title)} · ${date(s.updated_at)}</button>`).join('')}</div></div>`:''}${t.mode==='AI draft'?`<div class="mt-5 flex flex-wrap items-center gap-3"><button data-action="save-draft" data-id="${t.id}" class="btn secondary">${icon('file')}Save as draft resource</button><span class="text-[10px] muted">Human review required</span></div>`:''}</article>`}

async function loadSoc(id=null,quiet=false){if(socLoading)return;socLoading=true;try{const results=await Promise.all([api('/api/soc/config'),api('/api/soc/reviews')]);socConfig=results[0];socRuns=results[1];const activeId=id||socActive?.id;if(activeId)socActive=await api('/api/soc/reviews/'+activeId);if(page==='soc'&&(!quiet||socActive))render();clearTimeout(socPoll);if(page==='soc'&&socRuns.some(r=>['Queued','Running'].includes(r.status)))socPoll=setTimeout(()=>loadSoc(null,true),2200)}catch(e){toast(e.message)}finally{socLoading=false}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;try{if(b.dataset.action==='soc-new'){socActive=null;render()}else if(b.dataset.action==='soc-open')await loadSoc(b.dataset.id);else if(b.dataset.action==='soc-refresh')await loadSoc();else if(b.dataset.action==='soc-disconnect'){await api('/api/soc/google/disconnect','POST',{});await loadSoc();toast('Google account disconnected.')}else if(b.dataset.action==='soc-export'){b.disabled=true;b.textContent='Creating Google Sheet…';try{const sheet=await api('/api/soc/reviews/'+b.dataset.id+'/sheet','POST',{});await loadSoc(b.dataset.id);toast(sheet.verified?'Google Sheet created and cell content verified.':'Google Sheet created. Open it to verify the output.')}catch(err){b.disabled=false;b.textContent='Create review Google Sheet';throw err}}}catch(err){toast(err.message)}});
document.addEventListener('submit',async e=>{if(e.target.id!=='socForm')return;e.preventDefault();if(socBusy)return;const form=e.target;const data=new FormData(form);const error=$('#socFormError');const submit=form.querySelector('[type=submit]');for(const [,value]of data.entries()){if(value instanceof File&&value.size>25*1024*1024){error.textContent='Each file must be no larger than 25 MB.';return}}socBusy=true;submit.disabled=true;submit.textContent='Uploading…';try{const response=await fetch('/api/soc/reviews',{method:'POST',body:data});const result=await response.json();if(!response.ok)throw Error(result.error||'Upload failed.');socActive=result;await loadSoc(result.id);toast('SOC review started. You can return to it from saved reviews.')}catch(err){error.textContent=err.message}finally{socBusy=false;submit.disabled=false;submit.innerHTML=icon('spark')+'Prepare SOC review'}});

function secTableView(r){const names=Object.keys(r.tables);if(!names.includes(secTable))secTable=names[0];const records=r.tables[secTable]||[];const columns=Object.keys(records[0]||{});const count=25;const start=secTablePage*count;return `<div class="flex flex-wrap gap-3 justify-between items-center mb-4"><label class="text-xs muted">Review tab<select id="secTableSelect" class="mt-2 !text-xs">${names.map(n=>`<option ${n===secTable?'selected':''}>${esc(n)}</option>`).join('')}</select></label><span class="text-xs muted">${records.length} records · draft for human review</span></div><div class="overflow-auto max-h-[520px] border border-line rounded-lg"><table class="text-xs min-w-full border-collapse"><thead class="sticky top-0 bg-[#DFEAF8] text-[#002F93]"><tr>${columns.map(c=>`<th class="p-3 text-left border-b border-line font-medium min-w-[180px]">${esc(c.replaceAll('_',' '))}</th>`).join('')}</tr></thead><tbody>${records.slice(start,start+count).map(row=>`<tr class="even:bg-paper">${columns.map(c=>`<td class="p-3 align-top border-b border-line min-w-[180px] max-w-[420px]"><div class="whitespace-pre-wrap break-words max-h-56 overflow-y-auto">${esc(row[c])}</div></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="flex justify-between items-center mt-3"><span class="text-[10px] muted">Showing ${records.length?start+1:0}–${Math.min(start+count,records.length)} of ${records.length}. Full records are included in the workbook.</span><div class="flex gap-2"><button data-action="sec-prev" class="btn secondary" ${start===0?'disabled':''}>Previous</button><button data-action="sec-next" class="btn secondary" ${start+count>=records.length?'disabled':''}>Next</button></div></div>`}
function secRunView(run){const r=run.result;return `<section class="card p-6 sm:p-7"><div class="flex flex-wrap justify-between items-start gap-4"><div><p class="eyebrow text-brand mb-3">${esc(run.status)}</p><h2 class="text-xl font-medium text-ink">${esc(run.title)}</h2><p class="text-xs muted mt-2">${esc(run.context.form_type)} · ${esc(run.context.ticker)} · ${socDate(run.created_at)}</p></div><button data-action="sec-new" class="btn secondary">New review</button></div><div class="bg-paper p-4 rounded-lg mt-6"><p class="text-sm font-medium text-ink">${esc(run.stage)}</p><p class="text-xs muted leading-relaxed mt-2">${esc(run.steps.slice(-1)[0]?.message||'Your review is waiting to start.')}</p>${['Queued','Running'].includes(run.status)?'<div class="h-1 bg-[#DFEAF8] rounded-full mt-4"><div class="w-1/3 h-1 bg-brand animate-pulse"></div></div>':''}</div>${run.error?`<div role="alert" class="text-sm text-red-800 bg-red-50 border border-red-200 rounded p-4 mt-4">${esc(run.error)}</div>`:''}<details class="mt-5"><summary class="text-xs muted cursor-pointer">Inputs & processing history</summary><ul class="text-xs muted leading-relaxed space-y-2 mt-4">${run.files.map(f=>`<li>${esc(f.role)}: ${esc(f.name)}</li>`).join('')}</ul><ol class="text-xs muted space-y-3 mt-4">${run.steps.map(s=>`<li><span class="text-ink">${esc(s.stage)}</span> · ${socDate(s.at)}<br>${esc(s.message)}</li>`).join('')}</ol></details>${r?`<div class="border-t border-line mt-6 pt-6"><div class="flex flex-wrap gap-3 mb-6"><a href="/api/sec/reviews/${run.id}/workbook" class="btn primary">${icon('download')}Download review workbook</a><a href="/api/sec/reviews/${run.id}/sources" class="btn secondary">${icon('file')}Download source snapshot</a></div><div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">${[['sections','Sections parsed'],['subsections','Subsection blocks'],['footnotes','Footnotes parsed'],['suggestions','Wording proposals']].map(([key,label])=>`<div class="rounded-lg bg-paper p-4"><p clas function secPage(){return heading('Audit agents / SEC disclosure review','SEC filing disclosure review','Compare draft disclosures, investigate gaps, and prepare evidence-based wording for human review.')+`<div class="grid xl:grid-cols-[1fr_285px] gap-6 items-start"><div class="min-w-0">${secActive?secRunView(secActive):`<form id="secForm" class="card p-6 sm:p-7"><div class="flex gap-3 items-center mb-6"><span class="text-brand">${icon('book')}</span><div><h2 class="text-lg font-medium text-ink">Start a disclosure review</h2><p class="text-xs muted mt-1">Current draft, comparable filings, and a clear review scope.</p></div></div><div class="grid sm:grid-cols-2 gap-5">${formField('Review title *','title','','input','required maxlength="180" placeholder="Company — disclosure review"')}<label><span class="field-label">Filing form *</span><select name="form_type"><option>10-Q</option><option>10-K</option><option>S-1</option></select></label>${formField('Company ticker *','ticker','','input','required maxlength="12"')}${formField('Company name','company_name','','input','maxlength="200"')}${formField('Confirmed industry *','industry','','input','required maxlength="500"')}${formField('Review as-of date *','review_as_of','','input','type="date" required')}${formField('Comparisons filed before *','comparison_cutoff','','input','type="date" required')}${formField('Draft reporting period-end','period_end','','input','type="date"')}</div><p class="text-[10px] muted leading-relaxed mt-3">The cutoff is exclusive. SEC retrieval selects the most recent matching form filed before that date; confirm period and scope comparability.</p><div class="mt-6">${secUpload('draft','Current draft filing',true)}</div><div class="mt-7 pt-6 border-t border-line"><p class="eyebrow text-brand mb-4">01 / Comparison sources</p><label class="block"><span class="field-label">Retrieve missing comparisons from SEC EDGAR?</span><select id="secRetrieval" name="retrieve_sec"><option value="yes">Yes — retrieve public filings</option><option value="no">No — use uploaded filings only</option></select></label><div id="secContactField" class="mt-5">${formField('SEC retrieval contact *','filing_contact','','input','required maxlength="200" placeholder="Full Name (email@domain.com)"')}<p class="text-[10px] muted mt-2">Included in public SEC request headers. Confidential draft text is not sent to SEC.</p></div><div class="mt-5">${formField('Peer company tickers · up to three, separated by commas','peers','','input','maxlength="50"')}<p class="text-[10px] muted leading-relaxed mt-2">Choose comparable public companies. Missing peer filings remain explicit gaps in the corresponding comparison tabs.</p></div><label class="flex gap-3 items-start text-xs muted leading-relaxed mt-5"><input type="checkbox" name="industry_confirmed" value="yes" required class="!w-4 !h-4 mt-0.5 shrink-0"><span>I confirm the company, filing form, industry, and peer selections are appropriate for this review. The agent will flag source and business-model differences for verification.</span></label><details class="mt-5"><summary class="text-sm font-medium text-ink cursor-pointer">Upload prior or peer filings <span class="muted text-xs font-normal">(optional overrides)</span></summary><p class="text-xs muted mt-3 leading-relaxed">Uploaded files take precedence over retrieval. Confirm each file’s company, form, and period. Peer slots follow the ticker order above.</p><div class="grid sm:grid-cols-2 gap-4 mt-4">${secUpload('prior','Prior filed version')}${secUpload('peer1','Company 1 filing')}${secUpload('peer2','Company 2 filing')}${secUpload('peer3','Company 3 filing')}</div></details></div><div class="mt-7 pt-6 border-t border-line"><p class="eyebrow text-brand mb-4">02 / Accounting updates & context</p><div class="grid sm:grid-cols-2 gap-5">${formField('Filer status / relevant elections','filer_status','','input','maxlength="300"')}<label><span class="field-label">Reporting basis</span><select name="reporting_basis"><option value="Not confirmed">Not confirmed</option><option>US GAAP</option><option>IFRS</option><option>Other — explain in notes</option></select></label></div><div class="mt-5">${formField('Official FASB ASU source links · one per line','fasb_urls','','textarea','maxlength="16000" placeholder="https://storage.fasb.org/…"')}<p class="text-[10px] muted leading-relaxed mt-2">Optional, up to eight links. Candidates without readable official-source support stay unverified. Effective dates and applicability need human confirmation.</p></div><div class="mt-5">${formField('Review facts, materiality context, adoption elections, or focus areas','notes','','textarea','maxlength="4000"')}</div></div><details class="mt-7 pt-6 border-t border-line"><summary class="text-sm font-medium text-ink cursor-pointer">03 / Financial workbook tie-out <span class="muted text-xs font-normal">(optional)</span></summary><p class="text-xs muted leading-relaxed mt-3">If a financial workbook is supplied, the output adds a numeric-cell census and candidate matches to a filing PDF. Units, periods, labels, rounding, and formulas need human verification. Tie-out issues do not block the main review.</p><div class="grid sm:grid-cols-2 gap-4 mt-4">${secUpload('financials','Financial statements workbook',false,'financials')}${secUpload('tieout_pdf','Filing PDF for reconciliation',false,'pdf')}</div><p class="text-[10px] muted mt-3">If the current draft is a PDF, it is used when no separate filing PDF is supplied.</p><label class="block mt-5"><span class="field-label">Worksheets to enumerate</span><select name="tieout_policy"><option value="all">All worksheets, including hidden sheets</option><option value="visible">Visible worksheets only</option></select></label></details><label class="flex gap-3 items-start text-xs muted leading-relaxed mt-7"><input type="checkbox" name="consent" value="yes" required class="!w-4 !h-4 shrink-0 mt-0.5"><span>I confirm that these draft disclosures and comparison documents may be sent to the configured OpenAI service. Source files, analysis, and the review workbook are retained in this local workspace.</span></label><p id="secFormError" role="alert" class="text-sm text-red-700 mt-4"></p><div class="flex flex-wrap justify-between gap-3 items-center mt-5 pt-5 border-t border-line"><p class="text-[10px] muted">Draft output · No filing submission or approval</p><button class="btn primary" type="submit" ${!secConfig?.ai_configured||secBusy?'disabled':''}>${icon('spark')}${secBusy?'Uploading…':'Prepare disclosure review'}</button></div>${secConfig&&!secConfig.ai_configured?'<p class="text-xs text-[#002F93] bg-[#DFEAF8] rounded p-3 mt-4">AI setup required: configure OPENAI_API_KEY on the server to run the agent.</p>':''}</form>`}<section class="mt-7"><div class="flex justify-between items-center mb-4"><h2 class="text-base font-medium text-ink">Saved disclosure reviews</h2><button data-action="sec-refresh" class="text-xs text-brand">Refresh</button></div>${secRuns.length?`<div class="card divide-y divide-line">${secRuns.map(r=>`<button data-action="sec-open" data-id="${r.id}" class="w-full p-5 flex justify-between items-center gap-4 text-left hover:bg-paper"><span class="min-w-0"><span class="block text-sm font-medium text-ink break-words">${esc(r.title)}</span><span class="block text-[10px] muted mt-2">${esc(r.context.form_type)} · ${esc(r.context.ticker)} · ${socDate(r.created_at)}</span></span><span class="badge ${r.status==='Draft ready'?'badge-blue':''}">${esc(r.status)}</span></button>`).join('')}</div>`:empty('No disclosure reviews yet.','Review runs, evidence limitations, and downloadable workbooks will appear here.',null,'','book')}</section></div><aside class="space-y-5"><section class="card p-6"><p class="eyebrow text-brand mb-5">Agent readiness</p><div class="flex justify-between text-xs gap-3"><span>Review AI</span><span class="${secConfig?.ai_configured?'text-brand':'muted'}">${secConfig?secConfig.ai_configured?' async function loadSec(id=null,quiet=false){if(secLoading)return;secLoading=true;try{const results=await Promise.all([api('/api/sec/config'),api('/api/sec/reviews')]);secConfig=results[0];secRuns=results[1];const runId=id||secActive?.id;if(runId)secActive=await api('/api/sec/reviews/'+runId);if(page==='sec'&&(!quiet||secActive))render();clearTimeout(secPoll);if(page==='sec'&&secRuns.some(r=>['Queued','Running'].includes(r.status)))secPoll=setTimeout(()=>loadSec(null,true),2400)}catch(e){toast(e.message)}finally{secLoading=false}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;try{if(b.dataset.action==='sec-new'){secActive=null;secTablePage=0;render()}else if(b.dataset.action==='sec-open'){secTablePage=0;await loadSec(b.dataset.id)}else if(b.dataset.action==='sec-refresh')await loadSec();else if(b.dataset.action==='sec-prev'){secTablePage=Math.max(0,secTablePage-1);render()}else if(b.dataset.action==='sec-next'){secTablePage++;render()}}catch(err){toast(err.message)}});
document.addEventListener('change',e=>{if(e.target.id==='secTableSelect'){secTable=e.target.value;secTablePage=0;render()}else if(e.target.id==='secRetrieval'){const required=e.target.value==='yes';$('#secContactField').classList.toggle('hidden',!required);$('#secContactField input').required=required}});
document.addEventListener('submit',async e=>{if(e.target.id!=='secForm')return;e.preventDefault();if(secBusy)return;const form=e.target,data=new FormData(form),error=$('#secFormError'),submit=form.querySelector('[type=submit]');let total=0;for(const[,v]of data.entries())if(v instanceof File){total+=v.size;if(v.size>25*1024*1024){error.textContent='Each file must be no larger than 25 MB.';return}}if(total>79*1024*1024){error.textContent='Total uploaded files must be under 79 MB (80 MB request limit).';return}secBusy=true;submit.disabled=true;submit.textContent='Uploading…';try{const response=await fetch('/api/sec/reviews',{method:'POST',body:data});const result=await response.json();if(!response.ok)throw Error(result.error||'Upload failed.');secActive=result;secTablePage=0;await loadSec(result.id);toast('Disclosure review started. Progress is saved in this workspace.')}catch(err){error.textContent=err.message}finally{secBusy=false;submit.disabled=false;submit.innerHTML=icon('spark')+'Prepare disclosure review'}});

function accountingAgentsPage(){const agents=[{title:'Revenue Accounting Engine: From Contract to Ledger, Built for Control and Auditability',source:'ChipmunkRPA · eRev Cloud',description:'An open-source ASC 606 / IFRS 15 revenue subledger designed to move contracts through revenue schedules and journal entries with approval workflows, reconciliations, traceable calculations, and an audit log.',note:'The repository describes its calculation explanations as deterministic rather than AI-generated.',url:'https://github.com/ChipmunkRPA/erev-cloud',tag:'Revenue accounting'},{title:"Accessing and Analyzing SEC's XBRL Data Sets",source:'U.S. SEC · DERA',description:"Official SEC Python and Jupyter examples for reading, analyzing, filtering, joining, and visualizing Mutual Fund Prospectus Risk/Return Summary Data Sets with pandas.",note:'Includes examples for numeric facts, narrative text facts, custom facts, and multi-quarter datasets.',url:'https://github.com/sec-gov/python-for-dera-mutual-fund-risk-return-datasets',tag:'SEC data analysis'}];return heading('Curated tools and open-source resources','Useful Accounting AI Agent','External accounting, reporting, and data-analysis tools worth exploring. Review security, licensing, data handling, and accounting conclusions before use.')+`<section class="rounded-xl border border-[#c4d9f3] bg-[#DFEAF8] p-7 sm:p-9 mb-7"><p class="eyebrow text-brand mb-3">Accounting technology library</p><h2 class="text-2xl sm:text-3xl font-medium tracking-tight text-[#002F93]">Practical tools for controlled, auditable work.</h2><p class="text-sm leading-relaxed text-[#403E3C] mt-4 max-w-3xl">A curated starting point for accounting automation and public-data analysis. These are external repositories and are not endorsed, hosted, or independently validated by this application.</p></section><section class="grid lg:grid-cols-2 gap-5">${agents.map((agent,index)=>`<article class="card p-6 sm:p-7 flex flex-col"><div class="flex items-start justify-betwee function projectsAgentsPage(){const a=practiceAgents[practiceAgent],evidence=practiceAgent==='evidence-readiness';return heading('AI projects & learning','Audit practice agents','Use focused tools to structure analysis. They identify missing information and potential concerns without making final audit, legal, or scoping decisions.')+`<section class="grid lg:grid-cols-3 gap-4 mb-6">${Object.entries(practiceAgents).map(([id,x])=>`<button data-action="practice-mode" data-mode="${id}" class="card p-5 text-left ${practiceAgent===id?'ring-2 ring-[#0040E6]':''}"><span class="text-brand">${icon('spark')}</span><h2 class="text-sm font-medium text-ink mt-4">${esc(x.title)}</h2><p class="text-xs muted leading-relaxed mt-2">${esc(x.description)}</p></button>`).join('')}</section><form id="practiceAgentForm" class="card p-6 sm:p-7" enctype="multipart/form-data"><p class="eyebrow text-brand mb-2">${esc(a.title)}</p><p class="text-xs muted leading-relaxed mb-6">${esc(a.description)}</p><div class="space-y-5">${a.fields.map(([label,name])=>formField(label,name,'','textarea','required maxlength="30000"')).join('')}${evidence?`<label class="card p-5 block border-dashed"><span class="field-label">Upload the supporting material the person intends to submit *</span><input name="supporting_files" type="file" accept=".pdf,.xlsx,.csv,.docx,.txt" required multiple class="!text-xs !border-0 !p-0 file:mr-3 file:border-0 file:rounded file:bg-[#DFEAF8] file:text-[#002F93] file:px-3 file:py-2"><span class="block text-[10px] muted mt-3">PDF, XLSX, CSV, DOCX, or TXT · up to 10 files · 25 MB each · files are deleted after assessment</span></label>`:''}</div><div class="flex flex-wrap items-center gap-4 mt-5"><button class="btn primary" type="submit" ${evidence&&!state.ai_configured?'disabled':''}>${evidence?'Assess evidence with LLM':'Run agent'} ${icon('arrow')}</button><p id="practiceAgentStatus" class="text-xs muted">${evidence&&!state.ai_configured?'LLM connection required: configure OPENAI_API_KEY on the Railway server.':'Outputs are working drafts for human review.'}</p></div>${evidence?'<p class="text-[10px] muted leading-relaxed mt-4">The LLM receives the written request, stated risk, and extracted document text. It does not receive unrelated workspace data. PCAOB AS 1105 is used as an auditor evidence-design reference, not as a management legal checklist.</p>':''}</form>${practiceResultView()}<section class="mt-8 border-t border-line pt-8">${library()}</section>`}
async function loadImplementation(id=null){if(implementationLoading)return;implementationLoading=true;try{implementationRuns=await api('/api/implementation/assessments');if(id)implementationActive=await api('/api/implementation/assessments/'+id);if(page==='implementation')render()}catch(e){toast(e.message)}finally{implementationLoading=false}}
function implementationPage(){if(implementationActive){const a=implementationActive,s=a.summary,items=a.template.items.flatMap(x=>x.kind==='requirement'?(x.subchecks?.length?x.subchecks.map(c=>({...x,...c,parent_id:x.id,subchecks:[]})):[x]):[]);return heading('System implementation','System Implementation: Key SOX Checklist',a.template.intro||'Use this checklist for systems that affect financial reporting.',`<button data-action="implementation-back" class="btn secondary">Back to assessments</button>`)+`<section class="rounded-lg border border-[#c4d9f3] bg-[#DFEAF8] p-5 mb-6"><p class="text-xs leading-relaxed text-[#403E3C]"><span class="font-medium text-[#002F93]">Keep evidence:</span> ${esc(a.template.evidence_note||'Save supporting records and approvals showing who approved and when.')}</p></section><section class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-6">${[['Resolved',s.resolved],['Not met',s.not_met],['Pending',s.pending],['Attention',s.attention],['Complete',s.percent_resolved+'%']].map(x=>`<div class="card p-4"><p class="text-[10px] muted">${x[0]}</p><p class="text-2xl text-ink mt-2">${x[1]}</p></div>`).join('')}</section><section class="card p-6 mb-6"><div class="flex flex-wrap justify-between gap-3"><div><p class="eyebrow text-brand mb-2">${esc(a.system_name)}</p><h2 class="text-xl font-medium text-ink">${esc(a.title)}</h2><p class="text-xs muted mt-2">Owner: ${esc(a.owner||'Unassigned')} · Go-live: ${esc(a.go_live_date||'Not set')}</p></div><a class="btn secondary" href="/api/implementation/assessments/${a.id}/export">${icon('download')}Download CSV</a></div></section><div class="space-y-3">${items.map(item=>{const r=a.responses[item.id]||{};return`<button class="card w-full p-5 text-left hover:border-brand" data-action="implementation-requirement" data-id="${item.id}"><div class="flex flex-wrap justify-between gap-3"><span class="text-xs font-medium text-ink">${esc(item.number)}. ${esc(item.title||item.control_id)}</span><span class="badge ${r.status==='Met'?'badge-blue':''}">${esc(r.status||'Not assessed')}</span></div><p class="text-xs muted leading-relaxed mt-3">${esc(item.question)}</p><p class="text-[10px] muted leading-relaxed mt-3"><span class="font-medium text-ink">Evidence to keep:</span> ${esc(item.evidence_required)}</p>${r.evidence_reference?`<p class="text-[10px] text-brand mt-3">Evidence link/reference: ${esc(r.evidence_reference)}</p>`:''}</button>`}).join('')}</div>`}return heading('System implementation','System Implementation: Key SOX Checklist','Use this checklist for systems that affect financial reporting.',`<button data-action="implementation-new" class="btn primary">${icon('plus')}New assessment</button>`)+`<section class="rounded-lg border border-[#c4d9f3] bg-[#DFEAF8] p-5 mb-6"><p class="text-xs leading-relaxed text-[#403E3C]"><span class="font-medium text-[#002F93]">Keep evidence:</span> Save test results, reconciliations, deployment records, and approvals showing who approved and when. For each item, track status, owner, and an evidence link; explain any “N/A.”</p></section>${implementationRuns.length?`<div class="card divide-y divide-line">${implementationRuns.map(a=>`<button data-action="implementation-open" data-id="${a.id}" class="w-full p-5 text-left flex justify-between gap-4"><span><span class="text-sm font-medium text-ink">${esc(a.title)}</span><span class="block text-xs muted mt-2">${esc(a.system_name)} · ${a.summary.percent_resolved}% resolved</span></span><span class="badge">${a.summary.resolved}/${a.summary.total}</span></button>`).join('')}</div>`:empty('No implementation assessments yet.','Create an assessment to work through the six key SOX checklist items.','implementation-new','Create assessment','check')}`}
function implementationNew(){ $('#editor').innerHTML=`<form id="implementationCreateForm"><div class="p-7 border-b border-line flex justify-between"><h2 id="editorTitle" class="text-xl text-ink">New implementation assessment</h2><button type="button" data-action="close-editor">${icon('close')}</button></div><div class="p-7 space-y-5">${formField('Assessment title *','title','','input','required maxlength="200"')}${formField('System name *','system_name','','input','required maxlength="200"')}${formField('Source / legacy system','source_system','','input','maxlength="200"')}${formField('Owner','owner','','input','maxlength="200"')}${formField('Process','process','','input','maxlength="500"')}${formField('Go-live date','go_live_date','','input','type="date"')}<p id="implementationFormError" class="text-sm text-red-700"></p></div><div class="p-5 border-t border-line flex justify-end"><button class="btn primary">Create assessment</button></div></form>`;$('#editor').showModal()}
function implementationRequirement(id){const a=implementationActive,item=a.template.items.flatMap(x=>x.kind==='requirement'?(x.subchecks?.length?x.subchecks.map(c=>({...x,...c,parent_id:x.id,subchecks:[]})):[x]):[]).find(x=>x.id===id),r=a.responses[id];$('#editor').innerHTML=`<form id="implementationRequirementForm" data-id="${id}"><div class="p-7 border-b border-line flex justify-between gap-4"><div><p class="eyebrow text-brand mb-2">${esc(item.control_id)} · Check ${esc(item.number)}</p><h2 id="editorTitle" class="text-lg text-ink">${esc(item.question)}</h2></div><button type="button" data-action="close-editor">${icon('close')}</button></div><div class="p-7 space-y-5"><input type="hidden" name="expected_revision" value="${r.revision}"><label><span class="field-label">Status</span><select name="status">${['Not assessed','In progress','Met','Not met','Not applicable'].map(x=>`<option ${r.status===x?'selected':''}>${x}</option>`).join('')}</select></label>${formField('Evidence reference','evidence_reference',r.evidence_reference,'textarea','maxlength="4000"')}${formField('Gap / action notes','notes',r.notes,'textarea','maxlength="5000"')}${formField('N/A rationale','na_reason',r.na_reason,'textarea','maxlength="4000"')}${formField('Owner','owner',r.owner,'input','maxlength="200"')}${formField('Target date','target_date',r.target_date,'input','type="date"')}<label><span class="field-label">IA conclusion</span><select name="ia_conclusion">${['Not reviewed','No issues noted','Improvement opportunity','Issue identified','Further review needed'].map(x=>`<option ${r.ia_conclusion===x?'selected':''}>${x}</option>`).join('')}</select></label>${formField('IA procedure','ia_procedure',r.ia_procedure,'textarea','maxlength="5000"')}${formField('IA notes','ia_notes',r.ia_notes,'textarea','maxlength="5000"')}${formField('Reviewer','reviewer',r.reviewer,'input','maxlength="200"')}${formField('Review date','review_date',r.review_date,'input','type="date"')}<p id="implementationFormError" class="text-sm text-red-700"></p></div><div class="p-5 border-t border-line flex justify-end"><button class="btn primary">Save requirement</button></div></form>`;$('#editor').showModal()}
function render(){if(!loaded)return;$('#nav').innerHTML=sections.map(([id,i,label])=>`<a href="#${id}" class="nav-item ${page===id?'active':''}" ${page===id?'aria-current="page"':''}>${icon(i)}${label}</a>`).join('');$('#crumb').textContent=sections.find(s=>s[0]===page)?.[2]||'Search';$('#main').innerHTML=page==='overview'?jdOverview():page==='assistant'?assistantPage():page==='soc'?socPage():page==='sec'?secPage():page==='builder'?jdBuilderPage():page==='projects'?projectsAgentsPage():page==='accounting-agents'?accountingAgentWorkspace():library()}
function navigate(p){const agent=p.startsWith('projects-')?p.slice(9):'';if(practiceAgents[agent]){practiceAgent=agent;practiceResult=null;page='projects'}else page=sections.some(s=>s[0]===p)||p==='search'?p:'overview';filters={query:'',category:'',status:'',kind:''};$('#globalSearch').value='';$('#sidebar').classList.remove('open');$('#shade').classList.remove('open');render();window.scrollTo(0,0);if(page==='soc')loadSoc();if(page==='sec')loadSec()}
function formField(label,name,value='',type='input',extra=''){return `<label class="block"><span class="field-label">${label}</span>${type==='textarea'?`<textarea name="${name}" rows="${name==='content'?9:4}" ${extra}>${esc(value)}</textarea>`:`<input name="${name}" value="${esc(value)}" ${extra}>`}</label>`}
function openEditor(item=null){const r=item||{kind:page==='projects'?'project':page==='cases'?'case-study':'article',status:'Draft',phase:'Idea',tags:[]};$('#editor').innerHTML=`<form id="resourceForm" data-id="${r.id||''}"><div class="flex items-center justify-between border-b border-line px-7 py-5"><div><p class="eyebrow text-brand mb-2">Your knowledge, captured</p><h2 id="editorTitle" class="text-xl text-ink font-medium">${r.id?'Edit':'New'} resource</h2></div><button type="button" data-action="close-editor" aria-label="Close editor">${icon('close')}</button></div><div class="p-7 space-y-5"><div class="grid sm:grid-cols-2 gap-5"><label><span class="field-label">Resource type</span><select id="resourceKind" name="kind" aria-label="Resource type">${Object.entries(labels).map(([k,l])=>`<option value="${k}" ${r.kind===k?'selected':''}>${l}</option>`).join('')}</select></label><label><span class="field-label">Status</span><select name="status" aria-label="Status">${['Draft','Reviewed','Published'].map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></label></div>${formField('Title *','title',r.title,'input','required maxlength="200"')}${formField('Short description','summary',r.summary,'textarea','maxlength="1000"')}<div class="grid sm:grid-cols-2 gap-5">${formField('Topic','category',r.category,'input','list="topicOptions" maxlength="100"')}${formField('Tags · separated by commas','tags',(r.tags||[]).join(', '),'input','maxlength="1200"')}</div><datalist id="topicOptions">${topics.map(t=>`<option value="${t}">`).join('')}</datalist>${formField('Content *','content',r.content,'textarea','required maxlength="50000"')}<div id="projectFields" class="space-y-5 ${r.kind!=='project'?'hidden':''}"><div class="grid sm:grid-cols-2 gap-5">${formField('Project owner / DRI','owner',r.owner,'input','maxlength="200"')}<label><span class="field-label">Project phase</span><select name="phase" aria-label="Project phase">${['Idea','Planning','Build','Launch & Refine','Complete','Killed'].map(p=>`<option ${r.phase===p?'selected':''}>${p}</option>`).join('')}</select></label></div>${formField('Results & outcomes','results',r.results,'textarea','maxlength="10000"')}${formField('Lessons learned','lessons',r.lessons,'textarea','maxlength="10000"')}</div><p class="text-[11px] muted leading-relaxed">Use anonymized content for case studies. Mark a resource Reviewed or Published only after completing your review; the assistant can then use it.</p><p id="formError" role="alert" class="text-sm text-red-700"></p></div><div class="px-7 py-5 border-t border-line flex justify-end gap-3 bg-paper"><button type="button" data-action="close-editor" class="btn secondary">Cancel</button><button type="submit" class="btn primary">Save resource</button></div></form>`;$('#editor').showModal()}
function detail(id){const r=state.resources.find(r=>r.id===id);if(!r){toast('This resource was deleted. The assistant response retains its original source reference.');return}$('#detail').innerHTML=`<div class="p-7 border-b border-line"><div class="flex justify-between mb-5"><span class="eyebrow text-brand">${esc(labels[r.kind])} · ${esc(r.status)}</span><button data-action="close-detail" aria-label="Close resource">${icon('close')}</button></div><h2 id="detailTitle" class="text-2xl font-medium text-ink break-words">${esc(r.title)}</h2><p class="text-sm muted leading-relaxed mt-4">${esc(r.summary)}</p><div class="flex gap-2 flex-wrap mt-4">${[r.category,...r.tags].filter(Boolean).map(t=>`<span class="badge">${esc(t)}</span>`).join('')}</div></div><div class="p-7"><div class="prose-text">${esc(r.content)}</div>${r.kind==='project'?`<div class="border-t border-line mt-7 pt-6"><p class="text-xs muted mb-5">Owner: ${esc(r.owner||'Unassigned')} · Phase: ${esc(r.phase)}</p><h3 class="text-sm font-medium text-ink mb-3">Results & outcomes</h3><p class="prose-text">${esc(r.results||'No results recorded yet.')}</p><h3 class="text-sm font-medium text-ink mb-3 mt-6">Lessons learned</h3><p class="prose-text">${esc(r.lessons||'No lessons recorded yet.')}</p></div>`:''}<p class="text-[10px] muted mt-8">Created ${date(r.created_at)} · Updated ${date(r.updated_at)}</p></div><div class="px-7 py-5 border-t border-line flex flex-wrap gap-3 justify-between bg-paper"><button data-action="delete" data-id="${r.id}" class="text-xs text-red-700">Delete resource</button><div class="flex flex-wrap gap-2"><button data-action="close-detail" class="btn secondary" aria-label="Close resource">${icon('close')}Close</button><button data-action="download-resource" data-id="${r.id}" class="btn secondary">${icon('download')}Download .txt</button><button data-action="edit" data-id="${r.id}" class="btn primary">${icon('edit')}Edit resource</button></div></div>`;$('#detail').showModal()}
function editProfile(){const p=state.profile;$('#editor').innerHTML=`<form id="profileForm"><div class="p-7 border-b border-line flex justify-between"><h2 id="editorTitle" class="text-xl text-ink">Edit your profile</h2><button type="button" data-action="close-editor" aria-label="Close profile">${icon('close')}</button></div><div class="p-7 space-y-5">${[['Name','name'],['Professional headline','headline'],['Professional background','background'],['Career experience','experience'],['Approach to audit','approach']].map(([l,n],i)=>formField(l,n,p[n],i>1?'textarea':'input','maxlength="10000"')).join('')}<p id="formError" role="alert" class="text-sm text-red-700"></p></div><div class="p-5 border-t border-line flex gap-3 justify-end"><button type="button" data-action="close-editor" class="btn secondary">Cancel</button><button class="btn primary" type="submit">Save profile</button></div></form>`;$('#editor').showModal()}
function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;try{if(a==='menu'){$('#sidebar').classList.add('open');$('#shade').classList.add('open')}else if(a==='close-nav'){$('#sidebar').classList.remove('open');$('#shade').classList.remove('open')}else if(a==='navigate')location.hash=b.dataset.page;else if(a==='new')openEditor();else if(a==='import')$('#workspaceImport').click();else if(a==='implementation-new')implementationNew();else if(a==='implementation-open')await loadImplementation(id);else if(a==='implementation-back'){implementationActive=null;render()}else if(a==='implementation-requirement')implementationRequirement(id);else if(a==='detail')detail(id);else if(a==='close-editor')$('#editor').close();else if(a==='close-detail')$('#detail').close();else if(a==='edit'){$('#detail').close();openEditor(state.resources.find(r=>r.id===id))}else if(a==='edit-profile')editProfile();else if(a==='clear-filters'){filters={query:'',category:'',status:'',kind:''};render()}else if(a==='export'){const data=await api('/api/export');download(JSON.stringify(data,null,2),'jds-audit-lab.json','application/json')}else if(a==='delete'&&confirm('Delete this resource permanently? Historical activity and assistant responses will be retained.')){await api('/api/resources/'+id,'DELETE');$('#detail').close();await refresh();toast('Resource deleted.')}else if(a==='save-draft'){const t=state.conversations.find(t=>t.id===id);openEditor({title:'Draft: '+t.question.slice(0,180),summary:'AI-generated working draft — human review required.',content:t.answer+'\n\nSources at generation:\n'+t.sources.map((s,i)=>`[${i+1}] ${s.title} · ${s.updated_at}`).join('\n'),kind:'article',status:'Draft',tags:['AI draft']})}else if(a==='download-resource'){const r=state.resources.find(r=>r.id===id);download(`${r.title}\n${r.status} · ${r.category}\n\n${r.summary}\n\n${r.content}${r.kind==='project'?`\n\nOwner: ${r.owner}\nPhase: ${r.phase}\n\nResults\n${r.results}\n\nLessons learned\n${r.lessons}`:''}`,(r.title.replace(/[^a-z0-9]+/gi,'-').slice(0,80)||'resource')+'.txt','text/plain')}}catch(err){toast(err.message)}});
$('#workspaceImport').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;const data=new FormData();data.append('file',file);try{const r=await fetch('/api/import',{method:'POST',body:data});const result=await r.json().catch(()=>({}));if(!r.ok)throw Error(result.error||'Import failed.');await refresh();toast(result.message)}catch(err){toast(err.message)}finally{e.target.value=''}});
document.addEventListener('submit',async e=>{if(!['implementationCreateForm','implementationRequirementForm'].includes(e.target.id))return;e.preventDefault();const form=e.target,button=form.querySelector('[type="submit"],button:not([type])'),error=$('#implementationFormError'),values=Object.fromEntries(new FormData(form));button.disabled=true;try{if(form.id==='implementationCreateForm'){const result=await api('/api/implementation/assessments','POST',values);$('#editor').close();await loadImplementation(result.id)}else{values.expected_revision=Number(values.expected_revision);implementationActive=await api(`/api/implementation/assessments/${implementationActive.id}/requirements/${form.dataset.id}`,'PUT',values);$('#editor').close();render()}toast('Implementation checklist saved.')}catch(err){error.textContent=err.message}finally{button.disabled=false}});
document.addEventListener('submit',async e=>{if(!['resourceForm','profileForm','assistantForm'].includes(e.target.id))return;e.preventDefault();const form=e.target;const submit=form.querySelector('[type=submit]');const values=Object.fromEntries(new FormData(form));submit.disabled=true;try{if(form.id==='assistantForm'){busy=true;submit.textContent='Working…';const turn=await api('/api/assistant','POST',values);await refresh();toast(turn.mode==='AI draft'?'Draft ready for your review.':'Resource search complete.')}else{if(form.id==='resourceForm'){values.tags=values.tags.split(',').map(s=>s.trim()).filter(Boolean);await api('/api/resources'+(form.dataset.id?'/'+form.dataset.id:''),form.dataset.id?'PUT':'POST',values)}else await api('/api/profile','PUT',values);$('#editor').close();await refresh();toast('Changes saved.')}}catch(err){if(form.id==='assistantForm')toast(err.message);else $('#formError').textContent=err.message}finally{busy=false;submit.disabled=false;if(form.id==='assistantForm'){submit.innerHTML=icon('send')+'Run assistant';const visible=$('#assistantForm [type=submit]');if(visible){visible.disabled=false;visible.innerHTML=icon('send')+'Run assistant'}}}});
document.addEventListener('change',e=>{if(e.target.id==='resourceKind')$('#projectFields').classList.toggle('hidden',e.target.value!=='project');const key={categoryFilter:'category',statusFilter:'status',kindFilter:'kind'}[e.target.id];if(key){filters[key]=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='librarySearch'){const pos=e.target.selectionStart;filters.query=e.target.value;render();$('#librarySearch').focus();$('#librarySearch').setSelectionRange(pos,pos)}});
$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value;history.replaceState(null,'','#search');page='search';filters={query:q,category:'',status:'',kind:''};render()}});
window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#sidebar').classList.remove('open');$('#shade').classList.remove('open')}});
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
const initialHash=location.hash.slice(1),pathAgent=location.pathname.startsWith('/agents/')?location.pathname.slice(8):'',initialAgent=practiceAgents[pathAgent]?pathAgent:(initialHash.startsWith('projects-')?initialHash.slice(9):'');if(practiceAgents[initialAgent]){practiceAgent=initialAgent;page='projects'}else page=sections.some(s=>s[0]===initialHash)?initialHash:'overview';refresh().then(()=>{if(page==='soc')loadSoc();if(page==='sec')loadSec();const params=new URLSearchParams(location.search);if(params.has('google')){const messages={connected:'Opendoor Google account connected.', 'domain-denied':'Only verified Opendoor Google Workspace accounts may connect.',failed:'Google connection failed or was cancelled. Please retry.', 'not-configured':'Google OAuth is not configured on the server.'};toast(messages[params.get('google')]||'Check your Google connection.');history.replaceState(null,'',location.pathname+location.hash)}}).catch(e=>{$('#connection').textContent='Storage unavailable';$('#main').innerHTML=heading('Connection issue','Couldn’t load your workspace.',esc(e.message))+'<button class="btn primary" onclick="location.reload()">Retry connection</button>'});
</script>
